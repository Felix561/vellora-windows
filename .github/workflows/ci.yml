name: Validate Windows app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set 1.95.0
      - name: Remap compiler build paths
        run: ./.github/scripts/configure-release-paths.ps1 -PersistForGitHubActions
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck app and frontend tests
        run: npm run typecheck
      - name: Test frontend behavior
        run: npm test
      - name: Build frontend assets
        run: npm run build
      - name: Verify browser smoke runner
        run: ./.github/scripts/run-gui-smoke.ps1 -SelfTest
      - name: Test rendered GUI with synthetic data
        run: ./.github/scripts/run-gui-smoke.ps1
      - name: Verify release privacy scanner
        run: node .github/scripts/check-release-privacy.mjs --self-test
      - name: Verify packaged executable checks
        run: node .github/scripts/check-packaged-executable.mjs --self-test
      - name: Verify release source checks
        run: node .github/scripts/prepare-release-sources.mjs --self-test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify dependency notices are current
        run: |
          node .github/scripts/generate-notices.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Build Windows installer
        if: github.event.repository.private == true
        run: npm run tauri:build -- --ci -- --locked
      - name: Check unpacked executable for build paths
        if: github.event.repository.private == true
        run: >-
          node .github/scripts/check-release-privacy.mjs
          --file src-tauri/target/release/vellora.exe
          --forbid-path "$env:GITHUB_WORKSPACE"
          --forbid-path "$env:CARGO_HOME"
          --forbid-path "$env:VELLORA_RUST_SYSROOT"
      - name: Create installer checksums
        if: github.event.repository.private == true
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one review installer.' }
          $checksum = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          ($checksum.Hash.ToLowerInvariant() + '  ' + $installers[0].Name) |
            Set-Content -LiteralPath src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding ascii
      - name: Verify installer payload and bundled notices
        if: github.event.repository.private == true
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one review installer.' }
          ./.github/scripts/verify-review-installer.ps1 -InstallerPath $installers[0].FullName -ExpectedExecutablePath src-tauri/target/release/vellora.exe -ReportPath src-tauri/target/release/bundle/nsis/REVIEW_VERIFICATION.json
      - name: Prepare exact covered-source companion
        if: github.event.repository.private == true
        id: release-sources
        run: node .github/scripts/prepare-release-sources.mjs
      - name: Upload installer for review
        if: github.event.repository.private == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vellora-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/REVIEW_VERIFICATION.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload covered sources for private review
        if: github.event.repository.private == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vellora-release-sources-${{ github.sha }}
          path: ${{ steps.release-sources.outputs.source-directory }}/
          if-no-files-found: error
          retention-days: 14

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit all npm dependencies including build tooling
        run: npm audit --audit-level=low
      - name: Install pinned Rust security tooling
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust lockfile
        run: cargo +1.95.0 audit --file src-tauri/Cargo.lock

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete history without exposing findings
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'
